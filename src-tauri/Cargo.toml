[package]
name = "leafshield"
version = "0.6.0"
description = "A little space for your eyes"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
leafshield-core = { path = "../crates/leafshield-core" }
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Magnification"] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11-dl = "2.21"
