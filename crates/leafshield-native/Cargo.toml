[package]
name = "leafshield-native"
version = "0.7.0-dev.4"
edition = "2024"
license = "MIT"
description = "LeafShield native Windows desktop application"

[build-dependencies]
embed-resource = "3"

[dependencies]
leafshield-core = { path = "../leafshield-core" }
serde_json = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging", "Win32_UI_Magnification"] }
