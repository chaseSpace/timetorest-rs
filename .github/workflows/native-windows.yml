name: native-windows
on:
  push:
    branches: [dev.win]
  pull_request:
    paths:
      - "crates/**"
      - "locales/**"
      - "Cargo.*"
      - "scripts/build.mjs"
      - ".github/workflows/native-windows.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p leafshield-core -p leafshield-native
      - run: cargo clippy -p leafshield-core -p leafshield-native --all-targets -- -D warnings
      - run: npm run build:native
      - uses: actions/upload-artifact@v4
        with:
          name: leafshield-native-Windows
          path: artifacts/native-dev/
